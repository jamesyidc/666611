<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAR斜率系统 - 27币种独立监测</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1e2139 0%, #2a2d47 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header .subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .coin-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 30px;
        }

        .coin-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }

        .coin-btn:hover {
            background: rgba(102, 126, 234, 0.3);
            border-color: #667eea;
            transform: scale(1.05);
        }

        .coin-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
        }

        .coin-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
        }

        .coin-section.active {
            display: block;
        }

        .coin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.5);
        }

        .coin-title {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
        }

        .coin-stats {
            display: flex;
            gap: 20px;
            font-size: 14px;
        }

        .coin-stats span {
            opacity: 0.8;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            overflow: hidden;
        }

        .data-table thead {
            background: rgba(102, 126, 234, 0.2);
        }

        .data-table th {
            padding: 12px 10px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.3);
        }

        .data-table td {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
        }

        .data-table tbody tr:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .position-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .position-badge.bullish {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid #00ff88;
        }

        .position-badge.bearish {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border: 1px solid #ff4444;
        }

        .duration-badge {
            background: rgba(255, 200, 0, 0.2);
            color: #ffc800;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 16px;
            opacity: 0.6;
        }

        .error {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .view-all-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: #fff;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin: 10px 5px;
            transition: all 0.3s;
        }

        .view-all-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 768px) {
            .coin-selector {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }
            
            .data-table {
                font-size: 11px;
            }
            
            .data-table th,
            .data-table td {
                padding: 8px 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-buttons">
            <a href="/" class="nav-btn">🏠 返回首页</a>
            <a href="/kline-indicators" class="nav-btn">📊 K线指标系统</a>
        </div>

        <div class="header">
            <h1>📈 SAR斜率系统 - 27币种独立监测</h1>
            <div class="subtitle">
                每个币种独立存储，5分钟周期，保留48小时数据（576条记录/币）| 时间从近到远排列
            </div>
        </div>

        <div style="margin-bottom: 20px; text-align: center;">
            <button class="view-all-btn" onclick="showAllCoins()">📊 显示全部币种</button>
            <button class="view-all-btn" onclick="hideAllCoins()">📦 收起全部</button>
        </div>

        <!-- 币种选择器 -->
        <div class="coin-selector" id="coinSelector">
            <!-- 动态生成 -->
        </div>

        <!-- 币种数据区域 -->
        <div id="coinSections">
            <!-- 动态生成每个币种的数据表格 -->
        </div>
    </div>

    <script>
        const COINS = [
            'BTC', 'ETH', 'XRP', 'BNB', 'SOL', 'LTC', 'DOGE', 'SUI', 
            'TRX', 'TON', 'ETC', 'BCH', 'HBAR', 'XLM', 'FIL', 'LINK', 
            'CRO', 'DOT', 'AAVE', 'UNI', 'NEAR', 'APT', 'CFX', 'CRV', 
            'STX', 'LDO', 'TAO'
        ];

        let coinDataCache = {};

        // 初始化页面
        function init() {
            renderCoinSelector();
        }

        // 渲染币种选择器
        function renderCoinSelector() {
            const selector = document.getElementById('coinSelector');
            selector.innerHTML = COINS.map(coin => `
                <button class="coin-btn" onclick="toggleCoin('${coin}')" id="btn-${coin}">
                    ${coin}
                </button>
            `).join('');
        }

        // 切换币种显示
        function toggleCoin(coin) {
            const btn = document.getElementById(`btn-${coin}`);
            const section = document.getElementById(`section-${coin}`);

            if (section && section.classList.contains('active')) {
                // 隐藏
                section.classList.remove('active');
                btn.classList.remove('active');
            } else {
                // 显示
                if (!section) {
                    loadCoinData(coin);
                } else {
                    section.classList.add('active');
                    btn.classList.add('active');
                }
            }
        }

        // 显示所有币种
        function showAllCoins() {
            COINS.forEach(coin => {
                const section = document.getElementById(`section-${coin}`);
                const btn = document.getElementById(`btn-${coin}`);
                
                if (!section) {
                    loadCoinData(coin);
                } else {
                    section.classList.add('active');
                    btn.classList.add('active');
                }
            });
        }

        // 隐藏所有币种
        function hideAllCoins() {
            COINS.forEach(coin => {
                const section = document.getElementById(`section-${coin}`);
                const btn = document.getElementById(`btn-${coin}`);
                
                if (section) {
                    section.classList.remove('active');
                    btn.classList.remove('active');
                }
            });
        }

        // 加载币种数据
        async function loadCoinData(coin) {
            const symbol = `${coin}-USDT-SWAP`;
            const btn = document.getElementById(`btn-${coin}`);
            btn.textContent = `${coin} 加载中...`;

            try {
                const response = await fetch(`/api/sar-slope/history/${symbol}?days=2&limit=600`);
                const result = await response.json();

                if (result.success) {
                    coinDataCache[coin] = result.data;
                    renderCoinSection(coin, result.data);
                    btn.textContent = coin;
                    btn.classList.add('active');
                } else {
                    btn.textContent = `${coin} ⚠️`;
                    alert(`加载 ${coin} 数据失败: ${result.error}`);
                }
            } catch (error) {
                btn.textContent = `${coin} ❌`;
                console.error(`Error loading ${coin}:`, error);
                alert(`加载 ${coin} 数据失败: ${error.message}`);
            }
        }

        // 渲染币种数据区域
        function renderCoinSection(coin, data) {
            const container = document.getElementById('coinSections');
            
            // 检查是否已存在
            let section = document.getElementById(`section-${coin}`);
            if (section) {
                section.remove();
            }

            // 创建新区域
            section = document.createElement('div');
            section.id = `section-${coin}`;
            section.className = 'coin-section active';

            const totalRecords = data.length;
            const bullishCount = data.filter(d => d.sar_position === 'bullish').length;
            const bearishCount = data.filter(d => d.sar_position === 'bearish').length;

            section.innerHTML = `
                <div class="coin-header">
                    <div class="coin-title">${coin}-USDT-SWAP</div>
                    <div class="coin-stats">
                        <span>总记录: ${totalRecords}</span>
                        <span style="color: #00ff88;">多头: ${bullishCount}</span>
                        <span style="color: #ff4444;">空头: ${bearishCount}</span>
                    </div>
                </div>

                <table class="data-table">
                    <thead>
                        <tr>
                            <th>时间 (北京)</th>
                            <th>SAR值</th>
                            <th>开盘价</th>
                            <th>收盘价</th>
                            <th>SAR位置</th>
                            <th>持续周期</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.map(row => `
                            <tr>
                                <td>${row.datetime}</td>
                                <td>${formatNumber(row.sar_value)}</td>
                                <td>${formatNumber(row.price_open)}</td>
                                <td>${formatNumber(row.price)}</td>
                                <td>
                                    <span class="position-badge ${row.sar_position}">
                                        ${row.sar_position === 'bullish' ? '多头' : '空头'}
                                    </span>
                                </td>
                                <td>
                                    <span class="duration-badge">${row.position_duration} 周期</span>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            container.appendChild(section);
        }

        function formatNumber(num) {
            if (!num) return '-';
            return num >= 1 ? num.toFixed(2) : num.toFixed(6);
        }

        // 页面加载时初始化
        init();
    </script>
</body>
</html>
