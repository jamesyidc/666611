<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAR斜率系统 - 思路2实现</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1e2139 0%, #2a2d47 100%);
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1800px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00d4ff 0%, #3b7dff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            text-align: center;
            color: #8b92b8;
            font-size: 14px;
            margin-bottom: 30px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(59, 125, 255, 0.1);
            border: 1px solid rgba(59, 125, 255, 0.3);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
            color: #8b92b8;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .tab {
            background: rgba(59, 125, 255, 0.1);
            border: 1px solid rgba(59, 125, 255, 0.3);
            color: #00d4ff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .tab:hover {
            background: rgba(59, 125, 255, 0.2);
            border-color: rgba(59, 125, 255, 0.5);
        }
        
        .tab.active {
            background: #3b7dff;
            color: #fff;
            border-color: #3b7dff;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .table-container {
            background: rgba(42, 45, 71, 0.6);
            border-radius: 10px;
            padding: 20px;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: rgba(59, 125, 255, 0.2);
            padding: 12px;
            text-align: left;
            font-size: 13px;
            color: #00d4ff;
            border-bottom: 2px solid rgba(59, 125, 255, 0.3);
        }
        
        td {
            padding: 10px 12px;
            font-size: 13px;
            border-bottom: 1px solid rgba(139, 146, 184, 0.1);
        }
        
        tr:hover {
            background: rgba(59, 125, 255, 0.05);
        }
        
        .position-long {
            color: #00ff88;
            font-weight: bold;
        }
        
        .position-short {
            color: #ff4757;
            font-weight: bold;
        }
        
        .alert-warning {
            color: #ffa502;
        }
        
        .alert-high {
            color: #ff6348;
        }
        
        .alert-critical {
            color: #ff0000;
            font-weight: bold;
        }
        
        .extreme-badge {
            background: #ffd700;
            color: #000;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        
        .symbol-btn {
            background: rgba(59, 125, 255, 0.15);
            border: 1px solid rgba(59, 125, 255, 0.3);
            color: #00d4ff;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .symbol-btn:hover {
            background: rgba(59, 125, 255, 0.3);
            border-color: #3b7dff;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #8b92b8;
        }
        
        .refresh-btn {
            background: #3b7dff;
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .refresh-btn:hover {
            background: #2a5fd6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 SAR斜率系统</h1>
        <p class="subtitle">思路2实现：多空趋势 + 持续时间 + 平均值 + 异常预警 | 27个币种 | 5分钟K线 | 7天数据</p>
        
        <button class="refresh-btn" onclick="loadAllData()">🔄 刷新数据</button>
        
        <div class="stats-grid" id="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="total-symbols">-</div>
                <div class="stat-label">监控币种</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-alerts">-</div>
                <div class="stat-label">异常告警</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-conversions">-</div>
                <div class="stat-label">多空转换</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="long-count">-</div>
                <div class="stat-label">多头币种</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="short-count">-</div>
                <div class="stat-label">空头币种</div>
            </div>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('status')">📊 系统状态</div>
            <div class="tab" onclick="switchTab('alerts')">⚠️ 异常告警</div>
            <div class="tab" onclick="switchTab('conversions')">🔄 多空转换</div>
        </div>
        
        <div id="status-tab" class="tab-content active">
            <div class="table-container">
                <h3 style="margin-bottom: 15px;">所有币种SAR状态</h3>
                <div id="status-table" class="loading">加载中...</div>
            </div>
        </div>
        
        <div id="alerts-tab" class="tab-content">
            <div class="table-container">
                <h3 style="margin-bottom: 15px;">最近异常告警（偏离3天平均值30%以上）</h3>
                <div id="alerts-table" class="loading">加载中...</div>
            </div>
        </div>
        
        <div id="conversions-tab" class="tab-content">
            <div class="table-container">
                <h3 style="margin-bottom: 15px;">最近多空转换点</h3>
                <div id="conversions-table" class="loading">加载中...</div>
            </div>
        </div>
    </div>
    
    <script>
        let systemData = null;
        let alertsData = null;
        let conversionsData = null;
        
        function switchTab(tabName) {
            // 隐藏所有tab内容
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(el => {
                el.classList.remove('active');
            });
            
            // 显示选中的tab
            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');
        }
        
        async function loadSystemStatus() {
            try {
                const response = await fetch('/api/sar-slope/status');
                const data = await response.json();
                
                if (data.success) {
                    systemData = data.data;
                    
                    // 更新统计
                    document.getElementById('total-symbols').textContent = data.count;
                    
                    const longCount = systemData.filter(s => s.current_position === 'long').length;
                    const shortCount = systemData.filter(s => s.current_position === 'short').length;
                    
                    document.getElementById('long-count').textContent = longCount;
                    document.getElementById('short-count').textContent = shortCount;
                    
                    // 生成表格
                    let html = '<table><thead><tr>';
                    html += '<th>币种</th><th>当前状态</th><th>序列号</th><th>最新时间</th><th>K线数</th><th>操作</th>';
                    html += '</tr></thead><tbody>';
                    
                    systemData.forEach(item => {
                        const positionClass = item.current_position === 'long' ? 'position-long' : 'position-short';
                        const positionText = item.current_position === 'long' ? '多头' : '空头';
                        
                        html += '<tr>';
                        html += `<td><strong>${item.symbol}</strong></td>`;
                        html += `<td class="${positionClass}">${positionText}</td>`;
                        html += `<td>${item.current_sequence}</td>`;
                        html += `<td>${item.last_kline_time}</td>`;
                        html += `<td>${item.total_klines}</td>`;
                        html += `<td><button class="symbol-btn" onclick="viewSymbol('${item.symbol}')">详情</button></td>`;
                        html += '</tr>';
                    });
                    
                    html += '</tbody></table>';
                    document.getElementById('status-table').innerHTML = html;
                }
            } catch (error) {
                console.error('Error loading system status:', error);
                document.getElementById('status-table').innerHTML = '<p>加载失败</p>';
            }
        }
        
        async function loadAlerts() {
            try {
                const response = await fetch('/api/sar-slope/alerts?limit=100');
                const data = await response.json();
                
                if (data.success) {
                    alertsData = data.data;
                    document.getElementById('total-alerts').textContent = data.count;
                    
                    let html = '<table><thead><tr>';
                    html += '<th>币种</th><th>状态</th><th>序列号</th><th>SAR值</th><th>变化率</th><th>偏离度</th><th>等级</th><th>极值</th><th>时间</th>';
                    html += '</tr></thead><tbody>';
                    
                    alertsData.forEach(item => {
                        const positionClass = item.position === 'long' ? 'position-long' : 'position-short';
                        const positionText = item.position === 'long' ? '多头' : '空头';
                        
                        let levelClass = 'alert-warning';
                        if (item.level === 'high') levelClass = 'alert-high';
                        if (item.level === 'critical') levelClass = 'alert-critical';
                        
                        html += '<tr>';
                        html += `<td><strong>${item.symbol}</strong></td>`;
                        html += `<td class="${positionClass}">${positionText}</td>`;
                        html += `<td>${item.sequence}</td>`;
                        html += `<td>${item.sar.toFixed(6)}</td>`;
                        html += `<td>${item.change_percent.toFixed(4)}%</td>`;
                        html += `<td>${item.deviation.toFixed(2)}%</td>`;
                        html += `<td class="${levelClass}">${item.level.toUpperCase()}</td>`;
                        html += `<td>${item.is_extreme ? '<span class="extreme-badge">极值</span>' : '-'}</td>`;
                        html += `<td>${item.time}</td>`;
                        html += '</tr>';
                    });
                    
                    html += '</tbody></table>';
                    document.getElementById('alerts-table').innerHTML = html;
                }
            } catch (error) {
                console.error('Error loading alerts:', error);
                document.getElementById('alerts-table').innerHTML = '<p>加载失败</p>';
            }
        }
        
        async function loadConversions() {
            try {
                const response = await fetch('/api/sar-slope/conversions?limit=100');
                const data = await response.json();
                
                if (data.success) {
                    conversionsData = data.data;
                    document.getElementById('total-conversions').textContent = data.count;
                    
                    let html = '<table><thead><tr>';
                    html += '<th>币种</th><th>转换</th><th>SAR值</th><th>转换价格</th><th>上次持续</th><th>时间</th>';
                    html += '</tr></thead><tbody>';
                    
                    conversionsData.forEach(item => {
                        const fromClass = item.from_position === 'long' ? 'position-long' : 'position-short';
                        const toClass = item.to_position === 'long' ? 'position-long' : 'position-short';
                        const fromText = item.from_position === 'long' ? '多' : '空';
                        const toText = item.to_position === 'long' ? '多' : '空';
                        
                        html += '<tr>';
                        html += `<td><strong>${item.symbol}</strong></td>`;
                        html += `<td><span class="${fromClass}">${fromText}</span> → <span class="${toClass}">${toText}</span></td>`;
                        html += `<td>${item.sar.toFixed(4)}</td>`;
                        html += `<td>${item.price.toFixed(4)}</td>`;
                        html += `<td>${item.prev_duration}分钟</td>`;
                        html += `<td>${item.time}</td>`;
                        html += '</tr>';
                    });
                    
                    html += '</tbody></table>';
                    document.getElementById('conversions-table').innerHTML = html;
                }
            } catch (error) {
                console.error('Error loading conversions:', error);
                document.getElementById('conversions-table').innerHTML = '<p>加载失败</p>';
            }
        }
        
        function viewSymbol(symbol) {
            // 这里可以扩展为打开详细页面
            alert(`查看 ${symbol} 的详细数据\n\n功能待实现：显示该币种的完整SAR历史、变化率图表、异常点标记等`);
        }
        
        function loadAllData() {
            loadSystemStatus();
            loadAlerts();
            loadConversions();
        }
        
        // 页面加载时自动加载数据
        window.onload = () => {
            loadAllData();
            
            // 每30秒自动刷新
            setInterval(loadAllData, 30000);
        };
    </script>
</body>
</html>
