<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAR斜率系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: #1e2139;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 30px;
            color: #00d4ff;
        }
        
        .crypto-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .crypto-card {
            background: rgba(42, 45, 71, 0.8);
            border: 1px solid rgba(59, 125, 255, 0.3);
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .crypto-card:hover {
            background: rgba(59, 125, 255, 0.15);
            border-color: rgba(59, 125, 255, 0.6);
            transform: translateY(-2px);
        }
        
        .crypto-name {
            font-size: 18px;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 10px;
        }
        
        .crypto-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #8b92b8;
            margin-bottom: 8px;
        }
        
        .position-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .position-long {
            background: rgba(0, 255, 0, 0.2);
            color: #00ff00;
        }
        
        .position-short {
            background: rgba(255, 0, 0, 0.2);
            color: #ff4444;
        }
        
        .duration-list {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(139, 146, 184, 0.2);
        }
        
        .duration-title {
            font-size: 12px;
            color: #8b92b8;
            margin-bottom: 8px;
        }
        
        .duration-item {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 4px 0;
            color: #d0d4e8;
        }
        
        .duration-label {
            color: #8b92b8;
        }
        
        .duration-value {
            font-weight: 500;
            color: #00d4ff;
        }
        
        .loading {
            text-align: center;
            font-size: 18px;
            color: #8b92b8;
            padding: 50px;
        }
        
        .error {
            text-align: center;
            font-size: 16px;
            color: #ff4444;
            padding: 30px;
            background: rgba(255, 68, 68, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(255, 68, 68, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SAR 斜率系统 - 币种列表</h1>
        
        <div id="loading" class="loading">正在加载数据...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="cryptoGrid" class="crypto-grid"></div>
    </div>

    <script>
        // 加载数据
        async function loadData() {
            try {
                const response = await fetch('/api/sar-slope/status');
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error('加载数据失败');
                }
                
                document.getElementById('loading').style.display = 'none';
                renderCryptoGrid(data.data);
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = '加载数据失败: ' + error.message;
            }
        }
        
        // 渲染币种网格
        function renderCryptoGrid(cryptos) {
            const grid = document.getElementById('cryptoGrid');
            grid.innerHTML = '';
            
            cryptos.forEach(crypto => {
                const card = document.createElement('div');
                card.className = 'crypto-card';
                card.onclick = () => window.location.href = `/sar-slope/${crypto.symbol}`;
                
                const positionClass = crypto.current_position === 'long' ? 'position-long' : 'position-short';
                const positionText = crypto.current_position === 'long' ? '多头' : '空头';
                
                card.innerHTML = `
                    <div class="crypto-name">${crypto.symbol}</div>
                    <div class="crypto-info">
                        <span>当前状态:</span>
                        <span class="position-badge ${positionClass}">${positionText} ${crypto.current_sequence}</span>
                    </div>
                    <div class="crypto-info">
                        <span>K线数量:</span>
                        <span>${crypto.total_klines}</span>
                    </div>
                    <div class="crypto-info">
                        <span>最后更新:</span>
                        <span>${crypto.last_kline_time}</span>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }
        
        // 页面加载时获取数据
        loadData();
        
        // 每30秒自动刷新
        setInterval(loadData, 30000);
    </script>
</body>
</html>
