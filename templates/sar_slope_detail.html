<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{symbol}} - SAR 持续时间段统计</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: #1e2139;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(59, 125, 255, 0.3);
        }
        
        h1 {
            font-size: 28px;
            color: #00d4ff;
        }
        
        .back-btn {
            background: rgba(59, 125, 255, 0.2);
            border: 1px solid rgba(59, 125, 255, 0.4);
            color: #00d4ff;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        
        .back-btn:hover {
            background: rgba(59, 125, 255, 0.3);
        }
        
        .status-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(42, 45, 71, 0.6);
            border-radius: 8px;
        }
        
        .status-item {
            flex: 1;
        }
        
        .status-label {
            font-size: 12px;
            color: #8b92b8;
            margin-bottom: 5px;
        }
        
        .status-value {
            font-size: 18px;
            font-weight: bold;
            color: #00d4ff;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            background: rgba(59, 125, 255, 0.1);
            border: 1px solid rgba(59, 125, 255, 0.3);
            color: #00d4ff;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .tab.active {
            background: #3b7dff;
            color: #fff;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .duration-section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 20px;
            color: #00d4ff;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(59, 125, 255, 0.3);
        }
        
        .duration-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        
        .duration-card {
            background: rgba(42, 45, 71, 0.6);
            border: 1px solid rgba(59, 125, 255, 0.3);
            border-radius: 8px;
            padding: 15px;
        }
        
        .duration-header {
            font-size: 16px;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(139, 146, 184, 0.2);
        }
        
        .duration-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
        }
        
        .duration-label {
            color: #8b92b8;
        }
        
        .duration-value {
            color: #d0d4e8;
            font-weight: 500;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #8b92b8;
        }
        
        .error {
            text-align: center;
            padding: 30px;
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            border-radius: 8px;
            color: #ff4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="pageTitle">加载中...</h1>
            <a href="/sar-slope" class="back-btn">← 返回列表</a>
        </div>
        
        <div id="statusBar" class="status-bar" style="display: none;">
            <div class="status-item">
                <div class="status-label">当前状态</div>
                <div class="status-value" id="currentStatus">-</div>
            </div>
            <div class="status-item">
                <div class="status-label">序列号</div>
                <div class="status-value" id="currentSequence">-</div>
            </div>
            <div class="status-item">
                <div class="status-label">最后更新</div>
                <div class="status-value" id="lastUpdate">-</div>
            </div>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('long')">多头持续时间统计</div>
            <div class="tab" onclick="switchTab('short')">空头持续时间统计</div>
        </div>
        
        <div id="loading" class="loading">正在加载数据...</div>
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="longContent" class="tab-content active"></div>
        <div id="shortContent" class="tab-content"></div>
    </div>

    <script>
        const symbol = window.location.pathname.split('/').pop();
        
        async function loadData() {
            try {
                const response = await fetch(`/api/sar-slope/duration-signal/${symbol}`);
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error || '加载失败');
                }
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('pageTitle').textContent = `${symbol} - SAR 持续时间段统计`;
                
                // 显示当前状态
                const statusBar = document.getElementById('statusBar');
                statusBar.style.display = 'flex';
                document.getElementById('currentStatus').textContent = data.current_status.position === 'long' ? '多头' : '空头';
                document.getElementById('currentSequence').textContent = data.current_status.sequence;
                
                // 分组数据
                const longSignals = data.signals.filter(s => s.position === 'long');
                const shortSignals = data.signals.filter(s => s.position === 'short');
                
                renderDurationList('longContent', longSignals, 'long');
                renderDurationList('shortContent', shortSignals, 'short');
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = '加载失败: ' + error.message;
            }
        }
        
        function renderDurationList(containerId, signals, position) {
            const container = document.getElementById(containerId);
            
            if (signals.length === 0) {
                container.innerHTML = '<div class="loading">暂无数据</div>';
                return;
            }
            
            // 按持续时间排序
            signals.sort((a, b) => a.duration_minutes - b.duration_minutes);
            
            const html = `
                <div class="duration-section">
                    <div class="section-title">${position === 'long' ? '多头' : '空头'}持续时间段统计 (共 ${signals.length} 个时间段)</div>
                    <div class="duration-grid">
                        ${signals.map(signal => `
                            <div class="duration-card">
                                <div class="duration-header">持续 ${signal.duration_minutes} 分钟</div>
                                <div class="duration-row">
                                    <span class="duration-label">1天平均:</span>
                                    <span class="duration-value">${signal.averages['1day'].toFixed(6)}%</span>
                                </div>
                                <div class="duration-row">
                                    <span class="duration-label">3天平均:</span>
                                    <span class="duration-value">${signal.averages['3day'].toFixed(6)}%</span>
                                </div>
                                <div class="duration-row">
                                    <span class="duration-label">7天平均:</span>
                                    <span class="duration-value">${signal.averages['7day'] ? signal.averages['7day'].toFixed(6) + '%' : '-'}</span>
                                </div>
                                <div class="duration-row">
                                    <span class="duration-label">15天平均:</span>
                                    <span class="duration-value">${signal.averages['15day'] ? signal.averages['15day'].toFixed(6) + '%' : '-'}</span>
                                </div>
                                <div class="duration-row" style="margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(139, 146, 184, 0.2);">
                                    <span class="duration-label">1天样本数:</span>
                                    <span class="duration-value">${signal.sample_counts['1day']}</span>
                                </div>
                                <div class="duration-row">
                                    <span class="duration-label">3天样本数:</span>
                                    <span class="duration-value">${signal.sample_counts['3day']}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            
            container.innerHTML = html;
        }
        
        function switchTab(tab) {
            // 切换 tab 样式
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            // 切换内容
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(tab + 'Content').classList.add('active');
        }
        
        // 加载数据
        loadData();
        
        // 每30秒自动刷新
        setInterval(loadData, 30000);
    </script>
</body>
</html>
