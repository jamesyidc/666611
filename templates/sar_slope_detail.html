<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{symbol}} - SAR 持续时间段统计</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: #1e2139;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1800px;
            margin: 0 auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(59, 125, 255, 0.3);
        }
        
        h1 {
            font-size: 28px;
            color: #00d4ff;
        }
        
        .back-btn {
            background: rgba(59, 125, 255, 0.2);
            border: 1px solid rgba(59, 125, 255, 0.4);
            color: #00d4ff;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        
        .back-btn:hover {
            background: rgba(59, 125, 255, 0.3);
        }
        
        .status-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(42, 45, 71, 0.6);
            border-radius: 8px;
        }
        
        .status-item {
            text-align: center;
        }
        
        .status-label {
            font-size: 12px;
            color: #8b92b8;
            margin-bottom: 5px;
        }
        
        .status-value {
            font-size: 18px;
            font-weight: bold;
            color: #00d4ff;
        }
        
        .data-table {
            width: 100%;
            background: rgba(42, 45, 71, 0.6);
            border-radius: 8px;
            overflow: hidden;
        }
        
        .table-header {
            display: grid;
            grid-template-columns: 60px 80px 90px 90px 120px 100px 120px 100px 120px 100px 120px 100px 90px;
            gap: 8px;
            padding: 15px;
            background: rgba(59, 125, 255, 0.2);
            font-weight: bold;
            font-size: 12px;
            color: #00d4ff;
            border-bottom: 1px solid rgba(59, 125, 255, 0.3);
        }
        
        .table-row {
            display: grid;
            grid-template-columns: 60px 80px 90px 90px 120px 100px 120px 100px 120px 100px 120px 100px 90px;
            gap: 8px;
            padding: 12px 15px;
            font-size: 12px;
            border-bottom: 1px solid rgba(139, 146, 184, 0.1);
            transition: background 0.2s;
        }
        
        .table-row:hover {
            background: rgba(59, 125, 255, 0.1);
        }
        
        .table-cell {
            color: #d0d4e8;
        }
        
        .position-long {
            color: #00ff00;
            font-weight: bold;
        }
        
        .position-short {
            color: #ff4444;
            font-weight: bold;
        }
        
        .trend-increase {
            color: #ff4444;
        }
        
        .trend-decrease {
            color: #00ff00;
        }
        
        .bias-bullish {
            color: #00ff00;
            font-weight: bold;
        }
        
        .bias-bearish {
            color: #ff4444;
            font-weight: bold;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #8b92b8;
        }
        
        .error {
            text-align: center;
            padding: 30px;
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            border-radius: 8px;
            color: #ff4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="pageTitle">加载中...</h1>
            <a href="/sar-slope" class="back-btn">← 返回列表</a>
        </div>
        
        <div id="statusBar" class="status-bar" style="display: none;"></div>
        
        <div id="loading" class="loading">正在加载数据...</div>
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="dataTable" style="display: none;">
            <div class="data-table">
                <div class="table-header">
                    <div>序号</div>
                    <div>方向</div>
                    <div>币价</div>
                    <div>持续时间</div>
                    <div>当前值</div>
                    <div>1天变化%</div>
                    <div>1天平均</div>
                    <div>3天变化%</div>
                    <div>3天平均</div>
                    <div>7天变化%</div>
                    <div>7天平均</div>
                    <div>15天平均</div>
                    <div>偏向</div>
                </div>
                <div id="tableBody"></div>
            </div>
        </div>
    </div>

    <script>
        const symbol = window.location.pathname.split('/').pop();
        
        async function loadData() {
            try {
                const response = await fetch(`/api/sar-slope/transition-analysis/${symbol}`);
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error || '加载失败');
                }
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('pageTitle').textContent = `${symbol} - SAR 持续时间段统计`;
                
                renderStatusBar(data);
                renderDataTable(data);
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = '加载失败: ' + error.message;
            }
        }
        
        function renderStatusBar(data) {
            const statusBar = document.getElementById('statusBar');
            const status = data.current_status;
            const analysis = data.analysis;
            
            let html = `
                <div class="status-item">
                    <div class="status-label">当前状态</div>
                    <div class="status-value ${status.position === 'long' ? 'position-long' : 'position-short'}">
                        ${status.position === 'long' ? '多头' : '空头'}
                    </div>
                </div>
                <div class="status-item">
                    <div class="status-label">币价</div>
                    <div class="status-value">$${status.current_price ? status.current_price.toFixed(2) : 'N/A'}</div>
                </div>
                <div class="status-item">
                    <div class="status-label">持续时间</div>
                    <div class="status-value">${status.duration_minutes || 0}分钟</div>
                </div>
                <div class="status-item">
                    <div class="status-label">序列号</div>
                    <div class="status-value">${status.sequence}</div>
                </div>
                <div class="status-item">
                    <div class="status-label">最后更新</div>
                    <div class="status-value">${status.last_update}</div>
                </div>
            `;
            
            // 显示当前方向的偏向
            if (status.position === 'long' && analysis.long) {
                html += `
                    <div class="status-item">
                        <div class="status-label">多头信号</div>
                        <div class="status-value ${analysis.long.bias.type === 'bullish' ? 'bias-bullish' : 'bias-bearish'}">
                            ${analysis.long.bias.type_cn}
                        </div>
                    </div>
                `;
            } else if (status.position === 'short' && analysis.short) {
                html += `
                    <div class="status-item">
                        <div class="status-label">空头信号</div>
                        <div class="status-value ${analysis.short.bias.type === 'bullish' ? 'bias-bullish' : 'bias-bearish'}">
                            ${analysis.short.bias.type_cn}
                        </div>
                    </div>
                `;
            }
            
            statusBar.innerHTML = html;
            statusBar.style.display = 'grid';
        }
        
        function renderDataTable(data) {
            const tableBody = document.getElementById('tableBody');
            const analysis = data.analysis;
            
            let rows = [];
            let index = 1;
            
            // 添加多头数据
            if (analysis.long) {
                const long = analysis.long;
                const comp1day = long.period_comparisons['1day'];
                const comp3day = long.period_comparisons['3day'];
                const comp7day = long.period_comparisons['7day'];
                const comp15day = long.period_comparisons['15day'];
                
                rows.push({
                    index: index++,
                    position: 'long',
                    position_cn: '多头',
                    current_price: data.current_status.current_price,
                    duration_minutes: data.current_status.duration_minutes,
                    current_value: long.current_value,
                    avg_1day: comp1day.period_average,
                    change_1day: comp1day.difference_percent,
                    avg_3day: comp3day.period_average,
                    change_3day: comp3day.difference_percent,
                    avg_7day: comp7day.period_average,
                    change_7day: comp7day.difference_percent,
                    avg_15day: comp15day.period_average,
                    bias: long.bias.type_cn,
                    bias_type: long.bias.type,
                    time: long.current_time
                });
            }
            
            // 添加空头数据
            if (analysis.short) {
                const short = analysis.short;
                const comp1day = short.period_comparisons['1day'];
                const comp3day = short.period_comparisons['3day'];
                const comp7day = short.period_comparisons['7day'];
                const comp15day = short.period_comparisons['15day'];
                
                rows.push({
                    index: index++,
                    position: 'short',
                    position_cn: '空头',
                    current_price: data.current_status.current_price,
                    duration_minutes: data.current_status.duration_minutes,
                    current_value: short.current_value,
                    avg_1day: comp1day.period_average,
                    change_1day: comp1day.difference_percent,
                    avg_3day: comp3day.period_average,
                    change_3day: comp3day.difference_percent,
                    avg_7day: comp7day.period_average,
                    change_7day: comp7day.difference_percent,
                    avg_15day: comp15day.period_average,
                    bias: short.bias.type_cn,
                    bias_type: short.bias.type,
                    time: short.current_time
                });
            }
            
            // 渲染表格行
            let html = '';
            rows.forEach(row => {
                const change1Class = row.change_1day > 0 ? 'trend-increase' : 'trend-decrease';
                const change3Class = row.change_3day > 0 ? 'trend-increase' : 'trend-decrease';
                const change7Class = row.change_7day > 0 ? 'trend-increase' : 'trend-decrease';
                const biasClass = row.bias_type === 'bullish' ? 'bias-bullish' : 'bias-bearish';
                const positionClass = row.position === 'long' ? 'position-long' : 'position-short';
                
                html += `
                    <div class="table-row" title="${row.time}">
                        <div class="table-cell">${row.index}</div>
                        <div class="table-cell ${positionClass}">${row.position_cn}</div>
                        <div class="table-cell">$${row.current_price ? row.current_price.toFixed(2) : 'N/A'}</div>
                        <div class="table-cell">${row.duration_minutes || 0}分钟</div>
                        <div class="table-cell">${row.current_value.toFixed(6)}%</div>
                        <div class="table-cell ${change1Class}">${row.change_1day > 0 ? '+' : ''}${row.change_1day.toFixed(2)}%</div>
                        <div class="table-cell">${row.avg_1day.toFixed(6)}%</div>
                        <div class="table-cell ${change3Class}">${row.change_3day > 0 ? '+' : ''}${row.change_3day.toFixed(2)}%</div>
                        <div class="table-cell">${row.avg_3day.toFixed(6)}%</div>
                        <div class="table-cell ${change7Class}">${row.change_7day > 0 ? '+' : ''}${row.change_7day.toFixed(2)}%</div>
                        <div class="table-cell">${row.avg_7day.toFixed(6)}%</div>
                        <div class="table-cell">${row.avg_15day.toFixed(6)}%</div>
                        <div class="table-cell ${biasClass}">${row.bias}</div>
                    </div>
                `;
            });
            
            tableBody.innerHTML = html;
            document.getElementById('dataTable').style.display = 'block';
        }
        
        // 加载数据
        loadData();
        
        // 每30秒自动刷新
        setInterval(loadData, 30000);
    </script>
</body>
</html>
